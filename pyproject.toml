[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polycleaver"
dynamic = ["version"]
description = "Non-polar, stoichiometric surface slabs of complex minerals: polyanion scaffolds, counter-cations, hydration water and intercalated molecules."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Eric Mates-Torres", email = "eric.mates@uab.cat" },
]
maintainers = [
  { name = "Eric Mates-Torres", email = "eric.mates@uab.cat" },
]
keywords = ["surface", "slab", "miller", "mineral", "silicate", "phosphate", "clay", "hydrated minerals", "dipole", "pymatgen", "DFT"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "pymatgen>=2024.3",
  "ase>=3.23",
  "numpy>=1.26",
]

[project.optional-dependencies]
mcp = [
  "mcp>=1.2",
]
webapp = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
]
optimize = [
  "mace-torch>=0.3",
]
test = [
  "pytest>=8",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocs-include-markdown-plugin>=6.0",
]

[project.scripts]
polycleaver = "polycleaver.cli:main"
polycleaver-mcp = "polycleaver.mcp_server:main"

[project.urls]
Homepage = "https://github.com/ericmates/polycleaver"
Repository = "https://github.com/ericmates/polycleaver"
Documentation = "https://polycleaver.readthedocs.io"
Changelog = "https://github.com/ericmates/polycleaver/blob/main/CHANGELOG.md"
Issues = "https://github.com/ericmates/polycleaver/issues"

[tool.setuptools]
packages = ["polycleaver"]

[tool.setuptools.dynamic]
version = { attr = "polycleaver.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full slab-generation runs (minutes)"]
